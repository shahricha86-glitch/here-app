<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Parchment background -->
  <rect width="32" height="32" rx="6" fill="#F2EAD8"/>

  <!-- Colour stripe — top 3px -->
  <clipPath id="top-clip">
    <rect x="0" y="0" width="32" height="3" rx="0"/>
  </clipPath>
  <rect x="0"  y="0" width="6"  height="3" fill="#C4613A"/>
  <rect x="6"  y="0" width="6"  height="3" fill="#D4923A"/>
  <rect x="12" y="0" width="6"  height="3" fill="#E8A882"/>
  <rect x="18" y="0" width="6"  height="3" fill="#AABFA6"/>
  <rect x="24" y="0" width="8"  height="3" fill="#EDD98A"/>

  <!-- Colour stripe — bottom 3px -->
  <rect x="0"  y="29" width="6"  height="3" fill="#C4613A"/>
  <rect x="6"  y="29" width="6"  height="3" fill="#D4923A"/>
  <rect x="12" y="29" width="6"  height="3" fill="#E8A882"/>
  <rect x="18" y="29" width="6"  height="3" fill="#AABFA6"/>
  <rect x="24" y="29" width="8"  height="3" fill="#EDD98A"/>

  <!-- Italic "H." in warm dark brown — slightly rotated for the handmade feel -->
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="700"
    font-size="18"
    fill="#3D2E1E"
    transform="rotate(-2, 16, 16)"
  >H.</text>
</svg>
